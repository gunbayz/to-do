<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakkal</title>
<meta name="description" content="Pazar, market, bakkal — ne lazımsa listesi">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bakkal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --ink:#040317;
  --muted:#8a8ca0;
  --card:#f5f6f9;
  --line:#eef0f4;
  --accent:#FFD21F;       /* lemon yellow: fills only, always with dark ink on top */
  --accent-ink:#7A5800;   /* dark amber: yellow-family text/icons on white (7:1) */
  --accent-tint:#FFF7D6;
  --accent-tint-border:#F2DA7A;
  --danger:#e5484d;
  --sans:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  font-family:var(--sans);color:var(--ink);
  min-height:100vh;min-height:100dvh;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.app{max-width:560px;margin:0 auto;padding:0 16px 140px}

/* ---- sticky header: title + add row ---- */
.head{position:sticky;top:0;z-index:20;background:var(--bg);
  padding-top:calc(12px + env(safe-area-inset-top))}
.topbar{text-align:center;padding:6px 0 4px}
.topbar h1{font-size:27px;font-weight:700;line-height:1.2;letter-spacing:.04em}
.topbar .sub{font-size:17px;font-weight:500;color:var(--muted);margin-top:2px;min-height:22px}

button:focus-visible,input:focus-visible,[role="button"]:focus-visible{
  outline:3px solid var(--accent-ink);outline-offset:2px}

.add-row{display:flex;align-items:center;gap:10px;min-height:64px;margin-top:8px;
  border-bottom:1px solid var(--line);color:var(--accent-ink);
  font-size:21px;font-weight:600;cursor:text}
.add-row .plus{flex-shrink:0;width:48px;height:48px;margin-left:-10px;
  display:flex;align-items:center;justify-content:center}
.add-row .plus span{width:31px;height:31px;border-radius:50%;background:var(--accent);
  color:var(--ink);display:flex;align-items:center;justify-content:center}
.add-row input{flex:1;border:none;outline:none;background:transparent;font-family:var(--sans);
  font-size:21px;font-weight:500;color:var(--ink);padding:0;min-width:0;height:48px}
.add-row input::placeholder{color:var(--muted)}

/* ---- rows ---- */
ul.items{list-style:none}
li.item{display:flex;align-items:center;gap:10px;min-height:64px;
  border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg);position:relative}
li.item:active{background:var(--card)}
li.item.enter{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.check{flex-shrink:0;width:48px;height:48px;margin-left:-10px;
  display:flex;align-items:center;justify-content:center}
.check .ring{width:31px;height:31px;border-radius:50%;border:2px solid #cfd2de;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  transition:background .18s ease,border-color .18s ease}
li.item.checked .ring{background:var(--accent);border-color:var(--accent)}
.ring svg{opacity:0;transform:scale(.5);transition:opacity .18s ease,transform .18s ease}
li.item.checked .ring svg{opacity:1;transform:scale(1)}
li.item.pop .ring{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.label{flex:1;font-size:21px;font-weight:500;line-height:1.35;padding:16px 0;
  min-width:0;overflow-wrap:anywhere}
.label input{width:100%;border:none;outline:none;background:transparent;
  font-family:var(--sans);font-size:21px;font-weight:500;color:var(--ink)}
.t-label{background-image:linear-gradient(var(--muted),var(--muted));
  background-repeat:no-repeat;background-position:0 58%;background-size:0 2px;
  transition:background-size .28s ease,color .2s ease}
li.item.checked .label{color:var(--muted)}
li.item.checked .t-label{background-size:100% 2px}

.more{flex-shrink:0;width:48px;height:48px;margin-right:-10px;border:none;background:none;
  color:#aeb1c4;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.more:active{color:var(--accent-ink)}

li.section{list-style:none;display:flex;align-items:flex-end;justify-content:space-between;
  font-size:16px;font-weight:600;color:var(--muted);
  padding:26px 0 10px;border-bottom:1px solid var(--line)}

/* ---- empty state ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;min-height:50vh;text-align:center;padding:0 12px}
.empty[hidden]{display:none}
.empty p{font-size:20px;font-weight:500;color:var(--muted);line-height:1.45;max-width:300px}

/* ---- bottom clear button ---- */
.clear-wrap{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.clear-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;max-width:528px;margin:0 auto;min-height:60px;border:none;border-radius:18px;
  background:var(--accent);color:var(--ink);font-family:var(--sans);font-size:19px;font-weight:700;
  cursor:pointer;transform:translateY(0);opacity:1;
  transition:transform .3s cubic-bezier(.32,.72,.28,1),opacity .2s ease}
.clear-btn:active{filter:brightness(.9)}
.sheet-open .clear-wrap{opacity:0;transition:opacity .2s ease}
.clear-btn[hidden]{display:flex;transform:translateY(140%);opacity:0;pointer-events:none}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);width:calc(100% - 32px);max-width:528px;
  background:var(--accent-tint);color:var(--accent-ink);
  border:1.5px solid var(--accent-tint-border);
  font-size:18px;font-weight:600;line-height:1.4;
  padding:10px 10px 10px 20px;min-height:60px;border-radius:18px;opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;
  transition:opacity .26s cubic-bezier(.4,0,.2,1),transform .26s cubic-bezier(.4,0,.2,1);
  z-index:50}
.toast.low{bottom:calc(16px + env(safe-area-inset-bottom))}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .msg{flex:1;padding:6px 0}
.toast button{flex-shrink:0;font-family:var(--sans);font-size:18px;font-weight:700;
  color:var(--accent-ink);background:var(--bg);border:1.5px solid var(--accent-tint-border);
  border-radius:12px;min-height:48px;padding:0 16px;cursor:pointer}
.toast button[hidden]{display:none}

/* ---- action sheet ---- */
.sheet-scrim{position:fixed;inset:0;background:rgba(4,3,23,.34);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.sheet-scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,.28,1),visibility 0s linear .3s;
  max-width:560px;margin:0 auto;visibility:hidden}
.sheet.show{transform:translateY(0);visibility:visible;transition:transform .3s cubic-bezier(.32,.72,.28,1),visibility 0s}
.sheet-group{background:var(--bg);border-radius:18px;overflow:hidden;border:1.5px solid var(--line)}
.sheet-name{font-size:16px;font-weight:600;color:var(--muted);text-align:center;
  padding:16px 20px 14px;border-bottom:1px solid var(--line);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-group button{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;font-family:var(--sans);font-size:20px;font-weight:500;color:var(--ink);
  background:none;border:none;cursor:pointer;min-height:62px;border-bottom:1px solid var(--line)}
.sheet-group button svg{color:var(--accent-ink)}
.sheet-group button:last-child{border-bottom:none}
.sheet-group button:active{background:var(--card)}
.sheet-group button.danger{color:var(--danger)}
.sheet-group button.danger svg{color:var(--danger)}
.sheet-cancel{margin-top:10px}
.sheet-cancel button{display:block;width:100%;font-family:var(--sans);font-size:20px;
  font-weight:700;color:var(--accent-ink);background:var(--bg);border:1.5px solid var(--line);
  cursor:pointer;min-height:62px;border-radius:18px}
.sheet-cancel button:active{background:var(--card)}

/* ---- celebration: raining lemons ---- */
#celebrate{position:fixed;inset:0;background-color:var(--bg);
  /* soft yellow gingham tablecloth */
  background-image:linear-gradient(rgba(255,216,77,.28) 50%,transparent 50%),
                   linear-gradient(90deg,rgba(255,216,77,.28) 50%,transparent 50%);
  background-size:64px 64px;z-index:200;display:none;
  overflow:hidden;opacity:1;transition:opacity .5s ease}
#celebrate.show{display:block}
#celebrate.fade{opacity:0}
#celebrate .msg{position:absolute;left:16px;right:16px;top:40%;background:var(--bg);border-radius:22px;padding-top:22px;padding-bottom:22px;max-width:420px;margin:0 auto;z-index:1;text-align:center;
  font-size:30px;font-weight:700;color:var(--ink);padding:0 24px;line-height:1.3;
  animation:msgIn .5s ease}
#celebrate .msg small{display:block;font-size:19px;font-weight:500;color:var(--muted);margin-top:8px}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.drop{position:absolute;top:0;
  animation:drop 2.4s cubic-bezier(.45,0,.7,1) forwards}
@keyframes drop{from{transform:translateY(-120px) rotate(0)}to{transform:translateY(110vh) rotate(260deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="topbar">
      <h1>Bakkal</h1>
      <p class="sub" id="sub" aria-live="polite"></p>
    </div>
    <div class="add-row" id="addRow">
      <span class="plus" aria-hidden="true"><span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span></span>
      <input id="addInput" type="text" enterkeyhint="done" autocapitalize="sentences" autocorrect="on"
        autocomplete="off" spellcheck="false" maxlength="80" placeholder="Ne lazım?" aria-label="Listeye ekle">
    </div>
  </div>

  <ul class="items" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <svg width="140" height="140" viewBox="-1 -1 26 26" aria-hidden="true"><g transform="rotate(-14 12 12.5)"><path d="M2.7 12.5C2.7 11.7 3.5 11.2 4.5 11C5.7 7.9 8.5 6 12 6S18.3 7.9 19.5 11C20.5 11.2 21.3 11.7 21.3 12.5S20.5 13.8 19.5 14C18.3 17.1 15.5 19 12 19S5.7 17.1 4.5 14C3.5 13.8 2.7 13.3 2.7 12.5z" fill="#D9A21B" opacity=".45" transform="translate(.9 1)"/><path d="M2.7 12.5C2.7 11.7 3.5 11.2 4.5 11C5.7 7.9 8.5 6 12 6S18.3 7.9 19.5 11C20.5 11.2 21.3 11.7 21.3 12.5S20.5 13.8 19.5 14C18.3 17.1 15.5 19 12 19S5.7 17.1 4.5 14C3.5 13.8 2.7 13.3 2.7 12.5z" fill="#FFD21F"/><path d="M6.4 11c1.3-2 3.5-3.1 6-3.2" stroke="#fff" stroke-width="1" stroke-linecap="round" fill="none" opacity=".75"/></g></svg>
    <p id="emptyMsg"></p>
  </div>
</div>

<div class="clear-wrap">
  <button class="clear-btn" id="clearBtn" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/>
    </svg>
    <span id="clearText"></span>
  </button>
</div>

<div class="toast" id="toast" role="status">
  <span class="msg" id="toastMsg"></span>
  <button id="undoBtn" hidden>Geri al</button>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
  <div class="sheet-group">
    <div class="sheet-name" id="sheetName"></div>
    <button id="actEdit">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      Düzelt
    </button>
    <button id="actDelete" class="danger">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/></svg>
      Sil gitsin
    </button>
  </div>
  <div class="sheet-cancel"><button id="actCancel">Vazgeç</button></div>
</div>

<div id="celebrate" aria-hidden="true"><div class="msg" id="celebrateMsg"></div></div>

<script>
(function () {
  var STORAGE_KEY = 'bakkal-v1';
  var items = [];

  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.items)) {
      items = saved.items.filter(function (i) { return i && typeof i.text === 'string' && i.id; });
    }
  } catch (e) {}

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var subEl = document.getElementById('sub');
  var addInput = document.getElementById('addInput');
  var clearBtn = document.getElementById('clearBtn');
  var toastEl = document.getElementById('toast');
  var undoBtn = document.getElementById('undoBtn');
  var sheet = document.getElementById('sheet');
  var sheetScrim = document.getElementById('sheetScrim');
  var celebrateEl = document.getElementById('celebrate');
  var toastTimer = null, undoSnapshot = null, sheetId = null, freshId = null, popId = null;

  var LEMON = '<svg width="__S__" height="__S__" viewBox="-1 -1 26 26"><g transform="rotate(-14 12 12.5)"><path d="M2.7 12.5C2.7 11.7 3.5 11.2 4.5 11C5.7 7.9 8.5 6 12 6S18.3 7.9 19.5 11C20.5 11.2 21.3 11.7 21.3 12.5S20.5 13.8 19.5 14C18.3 17.1 15.5 19 12 19S5.7 17.1 4.5 14C3.5 13.8 2.7 13.3 2.7 12.5z" fill="#D9A21B" opacity=".45" transform="translate(.9 1)"/><path d="M2.7 12.5C2.7 11.7 3.5 11.2 4.5 11C5.7 7.9 8.5 6 12 6S18.3 7.9 19.5 11C20.5 11.2 21.3 11.7 21.3 12.5S20.5 13.8 19.5 14C18.3 17.1 15.5 19 12 19S5.7 17.1 4.5 14C3.5 13.8 2.7 13.3 2.7 12.5z" fill="#FFD21F"/><path d="M6.4 11c1.3-2 3.5-3.1 6-3.2" stroke="#fff" stroke-width="1" stroke-linecap="round" fill="none" opacity=".75"/></g></svg>';

  var EMPTY_MSGS = [
    'Liste bomboş. Ya dolap dolu, ya da bir şey unutuluyor.',
    'Hiçbir şey lazım değil mi? Ekmek var mı bir bak.',
    'Dolap dolu, gönül rahat.',
    'Bakkal amca seni özledi.'
  ];
  var PLACEHOLDERS = ['Ne lazım?', 'Ekmek, peynir, zeytin…', 'Limon bitti mi?', 'Yaz bakalım…'];
  var DONE_MSGS = [
    ['Eline sağlık!', 'Hepsi alındı, çay koyalım'],
    ['Maşallah!', 'Bakkal amca bugün çok mutlu'],
    ['Liste bitti!', 'Poşetleri taşımak kolay gelsin'],
    ['Bravo!', 'Hiçbir şey unutulmadı, inanılmaz']
  ];
  var DUP_MSGS = ['O zaten listede, iki tane mi alınacak?', 'Onu zaten yazdın, unutmayacağız merak etme'];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: items })); } catch (e) {}
  }
  function sentenceCase(s) { return s ? s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1) : s; }
  function norm(s) { return s.trim().toLocaleLowerCase('tr-TR').replace(/\s+/g, ' '); }
  function reduced() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function openItems() { return items.filter(function (i) { return !i.checked; }); }
  function doneItems() { return items.filter(function (i) { return i.checked; }); }

  addInput.placeholder = pick(PLACEHOLDERS);
  document.getElementById('emptyMsg').textContent = pick(EMPTY_MSGS);

  /* ---- toast (optionally with undo) ---- */
  function toast(msg, withUndo) {
    document.getElementById('toastMsg').textContent = msg;
    undoBtn.hidden = !withUndo;
    toastEl.classList.toggle('low', clearBtn.hidden);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, withUndo ? 5000 : 2400);
  }
  function hideToast() { toastEl.classList.remove('show'); undoSnapshot = null; }
  function snapshot() { undoSnapshot = JSON.parse(JSON.stringify(items)); }
  undoBtn.addEventListener('click', function () {
    if (!undoSnapshot) return;
    items = undoSnapshot;
    save(); render();
    clearTimeout(toastTimer);
    toastEl.classList.remove('show');
    undoSnapshot = null;
  });

  /* ---- rendering ---- */
  var CHECK = '<span class="ring"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
    '<path d="M3 8.5l3.2 3.2L13 5" stroke="#040317" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  function makeItem(item) {
    var li = document.createElement('li');
    li.className = 'item' + (item.checked ? ' checked' : '') +
      (item.id === freshId ? ' enter' : '') + (item.id === popId ? ' pop' : '');
    li.dataset.id = item.id;
    li.setAttribute('role', 'button');
    li.setAttribute('tabindex', '0');
    li.setAttribute('aria-pressed', item.checked ? 'true' : 'false');
    li.setAttribute('aria-label', item.text + (item.checked ? ', alındı' : ''));

    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.innerHTML = CHECK;

    var label = document.createElement('span');
    label.className = 'label';
    var inner = document.createElement('span');
    inner.className = 't-label';
    inner.textContent = item.text;
    label.appendChild(inner);

    var more = document.createElement('button');
    more.className = 'more';
    more.setAttribute('aria-label', 'Seçenekler: ' + item.text);
    more.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/></svg>';
    more.addEventListener('click', function (e) { e.stopPropagation(); openSheet(item.id); });

    li.addEventListener('click', function (e) {
      if (e.target.closest('.more') || e.target.tagName === 'INPUT') return;
      toggle(item.id);
    });
    li.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target === li) { e.preventDefault(); toggle(item.id); }
    });

    li.appendChild(check); li.appendChild(label); li.appendChild(more);
    return li;
  }

  function render() {
    var open = openItems(), done = doneItems();
    listEl.innerHTML = '';
    open.forEach(function (i) { listEl.appendChild(makeItem(i)); });
    if (done.length) {
      var head = document.createElement('li');
      head.className = 'section';
      head.dataset.id = 'section';
      head.textContent = 'Sepette';
      listEl.appendChild(head);
      done.forEach(function (i) { listEl.appendChild(makeItem(i)); });
    }
    freshId = null; popId = null;

    var empty = items.length === 0;
    listEl.hidden = empty;
    emptyEl.hidden = !empty;

    if (empty) subEl.textContent = '';
    else if (!open.length) subEl.textContent = 'Hepsi sepette!';
    else subEl.textContent = open.length === 1 ? '1 şey kaldı' : open.length + ' şey kaldı';

    clearBtn.hidden = done.length === 0;
    toastEl.classList.toggle('low', clearBtn.hidden);
    document.getElementById('clearText').textContent = done.length ? 'Sepettekileri kaldır (' + done.length + ')' : '';
    clearBtn.setAttribute('aria-label', 'Alınan ' + done.length + ' şeyi listeden kaldır');
  }

  /* FLIP: re-render, then glide rows from their old spots */
  function renderWithMotion() {
    if (reduced()) { render(); return; }
    var before = {};
    Array.prototype.forEach.call(listEl.children, function (el) { before[el.dataset.id] = el.getBoundingClientRect().top; });
    render();
    var movers = [];
    Array.prototype.forEach.call(listEl.children, function (el) {
      var old = before[el.dataset.id], now = el.getBoundingClientRect().top;
      if (old === undefined) { if (el.dataset.id === 'section') { el.style.opacity = '0'; movers.push(el); } }
      else if (Math.abs(old - now) > 0.5) { el.style.transform = 'translateY(' + (old - now) + 'px)'; el.style.zIndex = '2'; movers.push(el); }
    });
    if (!movers.length) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        movers.forEach(function (el) {
          el.style.transition = 'transform .42s cubic-bezier(.4,0,.2,1), opacity .42s ease';
          el.style.transform = ''; el.style.opacity = '';
        });
        setTimeout(function () { movers.forEach(function (el) { el.style.transition = ''; el.style.zIndex = ''; }); }, 460);
      });
    });
  }

  /* ---- tap to cross off (moves down) / tap again to bring back ---- */
  var busy = {};
  function toggle(id) {
    var idx = items.findIndex(function (i) { return i.id === id; });
    if (idx === -1 || busy[id]) return;
    var item = items[idx];
    var li = listEl.querySelector('li[data-id="' + id + '"]');
    item.checked = !item.checked;
    items.splice(idx, 1);
    if (item.checked) {
      items.push(item); // bottom of the basket
    } else {
      var firstDone = items.findIndex(function (i) { return i.checked; });
      items.splice(firstDone === -1 ? items.length : firstDone, 0, item); // end of the open list
    }
    save();
    // show the check + strike in place for a beat, then slide into position
    if (li && !reduced()) {
      busy[id] = true;
      li.classList.toggle('checked', item.checked);
      li.classList.add('pop');
      setTimeout(function () { delete busy[id]; renderWithMotion(); }, 260);
    } else {
      renderWithMotion();
    }
  }

  /* ---- add ---- */
  function addFromInput() {
    var raw = addInput.value.trim();
    if (!raw) return;
    var v = sentenceCase(raw);
    var existing = items.find(function (i) { return norm(i.text) === norm(v); });
    addInput.value = '';
    if (existing) {
      if (existing.checked) { toggle(existing.id); toast(existing.text + ' tekrar listede'); }
      else toast(pick(DUP_MSGS));
      return;
    }
    var nid = uid();
    var firstDone = items.findIndex(function (i) { return i.checked; });
    items.splice(firstDone === -1 ? items.length : firstDone, 0, { id: nid, text: v, checked: false });
    freshId = nid;
    save(); render();
  }
  // Enter adds and keeps the keyboard open for the next item
  addInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addFromInput(); }
  });
  addInput.addEventListener('blur', addFromInput);
  document.getElementById('addRow').addEventListener('click', function () { addInput.focus(); });

  /* ---- clear crossed-off ---- */
  clearBtn.addEventListener('click', function () {
    var done = doneItems();
    if (!done.length) return;
    snapshot();
    var undo = undoSnapshot;
    items = openItems();
    save(); render();
    if (!items.length) {
      celebrate(function () { undoSnapshot = undo; toast(done.length + ' şey listeden kalktı', true); });
    } else {
      undoSnapshot = undo;
      toast(done.length === 1 ? '1 şey listeden kalktı' : done.length + ' şey listeden kalktı', true);
    }
  });

  /* ---- action sheet: edit / delete ---- */
  var lastFocus = null;
  function openSheet(id) {
    var item = items.find(function (i) { return i.id === id; });
    if (!item) return;
    sheetId = id;
    lastFocus = document.activeElement;
    document.getElementById('sheetName').textContent = item.text;
    sheet.classList.add('show');
    document.body.classList.add('sheet-open');
    sheetScrim.classList.add('show');
    document.getElementById('actCancel').focus();
  }
  function closeSheet(restore) {
    sheet.classList.remove('show');
    document.body.classList.remove('sheet-open');
    sheetScrim.classList.remove('show');
    if (restore && lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }
  sheetScrim.addEventListener('click', function () { closeSheet(true); });
  document.getElementById('actCancel').addEventListener('click', function () { closeSheet(true); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet(true);
  });

  document.getElementById('actDelete').addEventListener('click', function () {
    var item = items.find(function (i) { return i.id === sheetId; });
    closeSheet(false);
    if (!item) return;
    snapshot();
    var undo = undoSnapshot;
    items = items.filter(function (i) { return i.id !== sheetId; });
    save(); render();
    undoSnapshot = undo;
    toast(item.text + ' silindi', true);
  });

  document.getElementById('actEdit').addEventListener('click', function () {
    var id = sheetId;
    closeSheet(false);
    var item = items.find(function (i) { return i.id === id; });
    var li = listEl.querySelector('li[data-id="' + id + '"]');
    if (!item || !li) return;
    var label = li.querySelector('.label');
    label.innerHTML = '<input type="text" enterkeyhint="done" autocapitalize="sentences" autocorrect="on" autocomplete="off" spellcheck="false" maxlength="80" aria-label="Düzelt">';
    var inp = label.querySelector('input');
    inp.value = item.text;
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    var done = false;
    function commit() {
      if (done) return; done = true;
      var v = sentenceCase(inp.value.trim());
      if (v) item.text = v;
      save(); render();
    }
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
      if (ev.key === 'Escape') { inp.value = item.text; inp.blur(); }
    });
    inp.addEventListener('blur', commit);
  });

  /* ---- celebration: lemons rain down ---- */
  function celebrate(after) {
    var m = pick(DONE_MSGS);
    if (reduced()) { after(); return; }
    var msgEl = document.getElementById('celebrateMsg');
    msgEl.textContent = m[0];
    var small = document.createElement('small');
    small.textContent = m[1];
    msgEl.appendChild(small);
    var n = 14;
    for (var k = 0; k < n; k++) {
      var el = document.createElement('span');
      var size = 34 + Math.round(Math.random() * 34);
      el.className = 'drop';
      el.style.left = (k / n * 100 + Math.random() * 4 - 2) + '%';
      el.style.marginLeft = (-size / 2) + 'px';
      el.style.animationDelay = (Math.random() * 1.1).toFixed(2) + 's';
      el.style.animationDuration = (2 + Math.random() * 1.2).toFixed(2) + 's';
      el.innerHTML = LEMON.replace(/__S__/g, String(size));
      celebrateEl.appendChild(el);
    }
    celebrateEl.classList.add('show');
    setTimeout(function () { celebrateEl.classList.add('fade'); }, 3000);
    setTimeout(function () {
      celebrateEl.classList.remove('show', 'fade');
      celebrateEl.querySelectorAll('.drop').forEach(function (el) { el.remove(); });
      after();
    }, 3500);
  }

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
